<div class="enrollment-form">

  <h2>Reactive Student Enrollment Request</h2>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

    <div>
      <label for="studentName">Student Name:</label>

      <input
        type="text"
        id="studentName"
        formControlName="studentName">
    </div>

    <div>
      <label for="studentEmail">Student Email:</label>

      <input
        type="email"
        id="studentEmail"
        formControlName="studentEmail">
    </div>

    <div>
      <label for="courseId">Course ID:</label>

      <input
        type="number"
        id="courseId"
        formControlName="courseId">
    </div>

    <div>
      <label for="preferredSemester">Preferred Semester:</label>

      <select
        id="preferredSemester"
        formControlName="preferredSemester">

        <option value="Odd">Odd</option>
        <option value="Even">Even</option>

      </select>
    </div>

    <div>
      <label>
        <input
          type="checkbox"
          formControlName="agreeToTerms">

        I agree to the terms and conditions
      </label>
    </div>

    <button
      type="submit"
      [disabled]="enrollForm.invalid">
      Submit
    </button>

  </form>

</div>
