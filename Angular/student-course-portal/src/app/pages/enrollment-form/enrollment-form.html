<div class="enrollment-form">
  <h2>Student Enrollment Request</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

    <!-- Student Name -->
    <div>
      <label for="studentName">Student Name:</label>

      <input
        type="text"
        id="studentName"
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel">

      <span
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
        Name is required
      </span>

      <span
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters
      </span>
    </div>

    <!-- Student Email -->
    <div>
      <label for="studentEmail">Student Email:</label>

      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel">

      <span
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
        Email is required
      </span>

      <span
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
        Please enter a valid email address
      </span>
    </div>

    <!-- Course ID -->
    <div>
      <label for="courseId">Course ID:</label>

      <input
        type="number"
        id="courseId"
        name="courseId"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel">

      <span
        *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
        Course ID is required
      </span>
    </div>

    <!-- Preferred Semester -->
    <div>
      <label for="preferredSemester">Preferred Semester:</label>

      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        required
        #semesterCtrl="ngModel">

        <option value="">Select Semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>

      <span
        *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">
        Please select a semester
      </span>
    </div>

    <!-- Agree to Terms -->
    <div>
      <label>
        <input
          type="checkbox"
          name="agreeToTerms"
          [(ngModel)]="agreeToTerms"
          required
          #termsCtrl="ngModel">

        I agree to the terms and conditions
      </label>

      <span
        *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
        You must agree to the terms
      </span>
    </div>

    <!-- Buttons -->
    <button
      type="submit"
      [disabled]="enrollForm.invalid">
      Submit
    </button>

    <button
      type="button"
      (click)="enrollForm.resetForm()">
      Reset
    </button>

    <!-- Success Message -->
    <div *ngIf="submitted">
      Enrollment request submitted successfully!
    </div>

  </form>
</div>
